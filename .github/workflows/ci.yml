name: CI

on:
  pull_request:
    branches:
      - main
      - Dev
  push:
    branches:
      - main
      - Dev

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/cli/go.mod

      - name: Run Go tests
        working-directory: src/cli
        run: go test ./...