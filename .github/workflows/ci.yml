name: CI

on:
  pull_request:
    branches:
      - main
      - Dev
  push:
    branches:
      - main
      - Dev

permissions:
  contents: write

jobs:
  documentation-pdf:
    name: Documentation PDF
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.head_ref != 'main' &&
      github.head_ref != 'Dev' &&
      github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc, LaTeX and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern
          python3 -m pip install --upgrade pip pyyaml

      - name: Build combined markdown source from MkDocs navigation
        run: |
          mkdir -p .tmp-doc
          python - <<'PY'
          import yaml
          from pathlib import Path

          root = Path('.')
          mkdocs_path = root / 'mkdocs.yml'
          data = yaml.safe_load(mkdocs_path.read_text(encoding='utf-8'))
          nav = data.get('nav', [])

          pages = []
          seen = set()

          def walk(entry):
              if isinstance(entry, dict):
                  for key, value in entry.items():
                      if isinstance(value, str):
                          rel = value.strip()
                          if rel not in seen:
                              pages.append((key, rel))
                              seen.add(rel)
                      elif isinstance(value, list):
                          walk(value)
                      elif isinstance(value, dict):
                          walk(value)
              elif isinstance(entry, list):
                  for item in entry:
                      walk(item)

          walk(nav)

          out = root / '.tmp-doc/documentation.md'
          content = [
              '# Documentation technique - SAE Application intelligente',
              '',
              '---',
              '',
              '## Table des matières',
              '',
              '\\tableofcontents',
              '',
              '---',
              ''
          ]

          for title, rel in pages:
              file_path = root / rel
              if not file_path.exists():
                  file_path = root / 'docs' / rel
              if not file_path.exists():
                  raise FileNotFoundError(f'Missing Markdown file referenced in mkdocs.yml: {rel}')

              text = file_path.read_text(encoding='utf-8')
              clean_title = title.strip() if title else file_path.stem.replace('_', ' ').title()
              content.append(f"# {clean_title}")
              content.append('')
              content.append(text.strip())
              content.append('')
              content.append('---')
              content.append('')

          out.write_text('\n'.join(content).strip() + '\n', encoding='utf-8')
          print(f'Generated {out} with {len(pages)} documentation pages.')
          PY

      - name: Generate PDF
        run: |
          pandoc .tmp-doc/documentation.md \
            --from=markdown+raw_tex \
            --standalone \
            --toc \
            --number-sections \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -V mainfont="DejaVu Sans" \
            -V monofont="DejaVu Sans Mono" \
            -o documentation.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: documentation.pdf

      - name: Commit PDF on the PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
          DOCS_BOT_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation.pdf
          if git diff --cached --quiet; then
            echo "No documentation PDF changes to push."
            exit 0
          fi
          git commit -m "docs: update generated documentation PDF"

          if [ -n "${DOCS_BOT_TOKEN}" ]; then
            git push "https://x-access-token:${DOCS_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${TARGET_BRANCH}"
          else
            git push origin HEAD:"${TARGET_BRANCH}"
          fi

  go-tests:
    needs: documentation-pdf
    if: "${{ github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'docs: update generated documentation PDF') }}"
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/cli/go.mod

      - name: Run Go tests
        working-directory: src/cli
        run: go test ./...

  documentation-build:
    needs: go-tests
    if: ${{ always() && (needs.go-tests.result == 'success' || needs.go-tests.result == 'skipped') }}
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Set documentation metadata
        id: meta
        shell: bash
        run: |
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_slug="${branch_name//\//-}"

          if [[ "${branch_name}" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
            echo "suffix= *" >> "$GITHUB_OUTPUT"
          fi

          echo "artifact_name=documentation-${branch_slug}" >> "$GITHUB_OUTPUT"

      - name: Apply development marker to docs title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('mkdocs.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          site_name = data.get('site_name', 'SAE - Application intelligente')
          suffix = "${{ steps.meta.outputs.suffix }}"

          if suffix.strip():
              data['site_name'] = f"{site_name}{suffix}"

          path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding='utf-8')
          print(f"site_name={data['site_name']}")
          PY

      - name: Build documentation
        run: mkdocs build

      - name: Upload documentation preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: site
          if-no-files-found: error

      - name: Setup GitHub Pages
        if: steps.meta.outputs.is_main == 'true'
        uses: actions/configure-pages@v5

      - name: Upload documentation for GitHub Pages
        if: steps.meta.outputs.is_main == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
