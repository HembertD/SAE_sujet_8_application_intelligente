name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/cli/go.mod

      - name: Run Go tests
        working-directory: src/cli
        run: go test ./...

  python-tests:
    name: Python tests (module C)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install GitPython "pytest>=7.0.0" "PyYAML>=6.0.3"

      - name: Run pytest (hors tests slow, nécessitent le serveur Ollama de l'IUT)
        run: python -m pytest -q

  documentation-build:
    needs: [go-tests, python-tests]
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6.1" "mkdocs-material>=9.6.4" "PyYAML>=6.0.3"

      - name: Set documentation metadata
        id: meta
        shell: bash
        run: |
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_slug="${branch_name//\//-}"

          if [[ "${branch_name}" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
            echo "suffix= *" >> "$GITHUB_OUTPUT"
          fi

          echo "artifact_name=documentation-${branch_slug}" >> "$GITHUB_OUTPUT"

      - name: Apply development marker to docs title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('mkdocs.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          site_name = data.get('site_name', 'SAE - Application intelligente')
          suffix = "${{ steps.meta.outputs.suffix }}"

          if suffix.strip():
              data['site_name'] = f"{site_name}{suffix}"

          path.write_text(
              yaml.safe_dump(
                  data,
                  sort_keys=False,
                  allow_unicode=True
              ),
              encoding='utf-8'
          )

          print(f"site_name={data['site_name']}")
          PY

      - name: Build documentation
        run: mkdocs build

      - name: Upload documentation preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: site
          if-no-files-found: error

      - name: Setup GitHub Pages
        if: steps.meta.outputs.is_main == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload documentation for GitHub Pages
        if: steps.meta.outputs.is_main == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    name: Deploy documentation to GitHub Pages
    needs: documentation-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
