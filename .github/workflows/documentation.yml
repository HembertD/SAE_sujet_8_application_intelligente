name: Documentation

on:
  pull_request:
    branches:
      - main
      - Dev
  push:
    branches:
      - main
      - Dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Set documentation metadata
        id: meta
        shell: bash
        run: |
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_slug="${branch_name//\//-}"

          if [[ "${branch_name}" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
            echo "suffix= *" >> "$GITHUB_OUTPUT"
          fi

          echo "artifact_name=documentation-${branch_slug}" >> "$GITHUB_OUTPUT"

      - name: Apply development marker to docs title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('mkdocs.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          site_name = data.get('site_name', 'SAE - Application intelligente')
          suffix = "${{ steps.meta.outputs.suffix }}"

          if suffix.strip():
              data['site_name'] = f"{site_name}{suffix}"

          path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding='utf-8')
          print(f"site_name={data['site_name']}")
          PY

      - name: Build documentation
        run: |
          mkdocs build

      - name: Upload documentation preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: site
          if-no-files-found: error

      - name: Setup GitHub Pages
        if: steps.meta.outputs.is_main == 'true'
        uses: actions/configure-pages@v5

      - name: Upload documentation for GitHub Pages
        if: steps.meta.outputs.is_main == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4