# docker-compose.yml - Orchestration du serveur Ollama local pour Gitelligence
#
# Usage :
#   docker compose up -d --build  # Lance le serveur Ollama avec le modèle défini dans .env
#   docker compose down           # Arrête et supprime le conteneur
#
# Variables d'environnement utiles :
#   OLLAMA_HOST   Adresse du serveur Ollama (défaut : http://localhost:11434)
#   OLLAMA_MODEL  Modèle à télécharger/utiliser (défaut : gemma4:26b, modèle IUT)
#   USE_DOCKER_LLM active/desactive l'usage du LLM via Docker depuis l'application
#
# Pour un modèle plus léger en local, définir OLLAMA_MODEL=gemma4:12b dans le .env.
# Pour activer le GPU NVIDIA, ajouter l'override : docker-compose.gpu.yml.

services:
  ollama:
    build: .
    container_name: gitelligence-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:26b}
    healthcheck:
      # `ollama list` est fourni par l'image officielle, contrairement à curl.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
    driver: local
