site_name: SAE - Application intelligente
site_description: Documentation technique de l'application intelligente
site_url: https://hembertd.github.io/SAE_sujet_8_application_intelligente/

theme:
  name: material
  language: fr

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/dev_marker.js

nav:
  - Accueil: index.md

  - Documentation technique:
      - Code source:
          - Présentation: doc_src_files/README.md
          - CLI Go:
              - Point d'entrée: doc_src_files/cli/main.md
              - Module Go: doc_src_files/cli/go_mod.md
              - Bridge:
                  - Client: doc_src_files/cli/bridge/client.md
                  - Backend: doc_src_files/cli/bridge/backend_client.md
                  - Environnement: doc_src_files/cli/bridge/env.md
                  - Mock: doc_src_files/cli/bridge/mock_client.md
                  - Client Python: doc_src_files/cli/bridge/python_client.md
              - Modèles: doc_src_files/cli/models/types.md
              - UI:
                  - Boîtes: doc_src_files/cli/ui/box.md
                  - Spinner: doc_src_files/cli/ui/spinner.md
                  - Styles: doc_src_files/cli/ui/styles.md
              - Vues:
                  - Menu: doc_src_files/cli/views/menu_view.md
                  - Commit: doc_src_files/cli/views/commit_view.md
                  - Config: doc_src_files/cli/views/config_view.md
                  - Release notes: doc_src_files/cli/views/release_notes_view.md
          - git_commit_release_notes_generator:
              - __init__: doc_src_files/git_commit_release_notes_generator/__init__.md
              - config: doc_src_files/git_commit_release_notes_generator/config.md
              - models: doc_src_files/git_commit_release_notes_generator/models.md
              - Ollama:
                  - __init__: doc_src_files/git_commit_release_notes_generator/ollama_client/__init__.md
                  - base: doc_src_files/git_commit_release_notes_generator/ollama_client/base.md
                  - embedding: doc_src_files/git_commit_release_notes_generator/ollama_client/embedding.md
                  - exceptions: doc_src_files/git_commit_release_notes_generator/ollama_client/exceptions.md
                  - llm: doc_src_files/git_commit_release_notes_generator/ollama_client/llm.md
                  - mock_llm: doc_src_files/git_commit_release_notes_generator/ollama_client/mock_llm.md
                  - Prompt système: doc_src_files/git_commit_release_notes_generator/ollama_client/prompts/commit_message_system.md
              - Services:
                  - __init__: doc_src_files/git_commit_release_notes_generator/service/__init__.md
                  - core: doc_src_files/git_commit_release_notes_generator/service/core.md
                  - git_wrapper: doc_src_files/git_commit_release_notes_generator/service/git_wrapper.md
                  - utils: doc_src_files/git_commit_release_notes_generator/service/utils.md
          - Scripts:
              - Métriques: doc_scripts_files/run_metrics.md
              - PDF: doc_scripts_files/generate_documentation_pdf.md
      - CLI Go (guide): explication_go_cli.md

      - Tests:
          - Présentation: doc_test_files/README.md
          - Core (point d'entrée): doc_test_files/test_core.md
          - Git wrapper: doc_test_files/test_git_wrapper.md
          - Intégration Git wrapper (slow): doc_test_files/test_integration_git_wrapper_slow.md
          - Ollama LLM: doc_test_files/test_ollama_llm.md
          - Ollama LLM (slow, réseau réel): doc_test_files/test_ollama_llm_slow.md
          - Mock IA: doc_test_files/test_mock_ai.md
          - Golden diffs: doc_test_files/fixtures/golden_diffs.md
          - Golden diffs (slow, réseau réel): doc_test_files/test_golden_diffs_slow.md
          - CLI Go:
              - Bridge: doc_test_files/cli/bridge_test.md
              - Module Go: doc_test_files/cli/go_mod.md
          - Tests de situation:
              - Initialisation: doc_test_files/situation_test/init_test.md
              - Désinitialisation: doc_test_files/situation_test/deinit_test.md

      - CI et déploiement:
          - Déploiement de la documentation: deploiement_documentation.md
          - Tests automatiques via GitHub Actions: deploiement_tests_workflows.md

  - Monitoring:
      - Sprint 00: monitoring/sprint-00.md
      - Sprint 01: monitoring/sprint-01.md
      - Sprint 02: monitoring/sprint-02.md
      - Sprint 03: monitoring/sprint-03.md